<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Sonoro Assistivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 aria-label="Sensor Sonoro Assistivo">Sensor Sonoro Assistivo</h1>
    <section aria-labelledby="titulo-legenda">
        <h2 id="titulo-legenda">Níveis de alerta por distância</h2>
        <ul>
            <li>Até 75 centímetros: Cuidado, obstáculo muito próximo.</li>
            <li>De 76 e 95 centímetros: Obstáculo próximo.</li>
            <li>Acima de 95 centímetros: Obstáculo à frente.</li>
        </ul>
    </section>
    <button id="btnIniciar" aria-label="Iniciar Monitoramento de distância">
        Clique para iniciar sistema
    </button>
    <button id="btnDesligar" aria-label="Desligar Monitoramento de distância" disabled>
        Clique para desligar sistema
    </button>

    <script src="script.js"></script>
</body>
</html>
